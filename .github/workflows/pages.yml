name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Relance manuelle : une publication échouée ne se rejoue pas (son artefact resterait en double).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # L'envoi et la publication sont deux tâches : publiée dans la même tâche que son envoi,
  # l'archive n'était parfois pas encore enregistrée (« No artifacts named "github-pages" »).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
